name: Group request
description: Ask for a group for your clan or friends group
title: "Group request: "
labels: ["group request"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and I'll set up your group. **Please don't put a password in this issue.** I'll arrange
        to send it privately once the group exists.
  - type: input
    id: name
    attributes:
      label: Group name
      description: What members will type to join, for example "My Clan". Letters, numbers and spaces; at most 16 letters and numbers once spaces are removed.
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Roughly how many people will use it?
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: In-game name of the person who'll run the group
      description: They'll receive the password and share it with the group.
    validations:
      required: true
  - type: textarea
    id: contact
    attributes:
      label: How can I reach that person privately?
      description: For example a Discord username. Leave it empty if you'd rather arrange it in the comments.
    validations:
      required: false
