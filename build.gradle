plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.clanlfg'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// `./gradlew run` starts RuneLite in developer mode with this plugin loaded.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.clanlfg.ClanLfgPluginTest'

	jvmArgs "-ea"
	// Point the plugin at a local `wrangler dev` server instead of production, e.g.
	//   ./gradlew run -Pserver=http://localhost:8787
	if (project.hasProperty('server')) {
		jvmArgs "-Dclanlfg.server=" + project.property('server')
	}
	args "--developer-mode", "--debug"
}
